<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MouseEngine-Settings</title>
    <link rel="stylesheet" href="css/mainUIWeb.css">
    <link rel="stylesheet" href="css/settingsUI.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left"><div class="header-title" data-i18n="settings">设置</div></div>
        </div>
        <div class="main-content">
            <div class="settings-navbar">
                <div class="settings-nav-item active" data-page="basic" data-i18n="basicSettings">基本设置</div>
                <div class="settings-nav-item" data-page="advanced" data-i18n="advancedSettings">高级设置</div>
                <div class="settings-nav-item" data-page="whitelist" data-i18n="programWhitelist">程序白名单</div>
                <div class="settings-nav-item" data-page="about" data-i18n="about">关于</div>
            </div>
            <div class="settings-container">
                <div class="settings-content">
                    <!-- 内容由 JS 动态渲染（参见 settingsUI.js 中的 renderXxx 函数） -->
                </div>
            </div>
        </div>
    </div>
    <!-- 恢复备份风险确认弹窗 -->
    <div id="restoreBackupModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <div class="modal-title" data-i18n="backupRestoreTitle">恢复备份</div>
                <span class="close" onclick="closeRestoreBackupModal()">&times;</span>
            </div>
            <div class="modal-body" style="max-height: none;">
                <p id="restoreBackupWarning" style="color: #f59e0b; font-size: 13px; line-height: 1.6; margin-bottom: 16px;" data-i18n="backupRestoreWarning">
                    这将覆盖现有的所有配置文件。在导入前，请先确认当前配置已有备份版本。
                </p>
                <p style="font-size: 12px; color: #94a3b8; line-height: 1.5; margin-bottom: 8px;" data-i18n="backupRestoreMergeHint">
                    <b>合并至当前配置</b>：不会删除原有内容，同名光标组将使用恢复的版本。
                </p>
                <p style="font-size: 12px; color: #94a3b8; line-height: 1.5; margin-bottom: 20px;" data-i18n="backupRestoreOverwriteHint">
                    <b>完全覆盖当前配置</b>：删除除恢复文件以外的所有鼠标组和配置。
                </p>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button class="settings-btn" id="restoreBackupMergeBtn" data-i18n="backupMerge">合并至当前配置</button>
                    <button class="settings-btn" id="restoreBackupOverwriteBtn" data-i18n="backupOverwrite">完全覆盖当前配置</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/pywebviewBridge.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/settingsUI.js"></script>
</body>
</html>
