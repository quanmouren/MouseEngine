<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MouseEngine-Settings</title>
    <link rel="stylesheet" href="css/mainUIWeb.css">
    <link rel="stylesheet" href="css/settingsUI.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left"><div class="header-title" data-i18n="settings">设置</div></div>
        </div>
        <div class="main-content">
            <div class="settings-navbar">
                <div class="settings-nav-item active" data-page="basic" data-i18n="basicSettings">基本设置</div>
                <div class="settings-nav-item" data-page="advanced" data-i18n="advancedSettings">高级设置</div>
                <div class="settings-nav-item" data-page="whitelist" data-i18n="programWhitelist">程序白名单</div>
                <div class="settings-nav-item" data-page="about" data-i18n="about">关于</div>
            </div>
            <div class="settings-container">
                <div class="settings-content">
                    <div class="settings-title" data-i18n="basicSettings">基本设置</div>
                    <div class="settings-section">
                        <div class="settings-section-title">应用设置</div>
                        <div class="settings-item">
                            <div class="settings-label">启动时自动运行</div>
                            <div class="settings-control"><input type="checkbox" id="autoStart"></div>
                        </div>
                        <div class="settings-item settings-item-double-row">
                            <div class="settings-label-row"><div class="settings-label">Wallpaper Engine路径</div></div>
                            <div class="settings-control-row">
                                <input type="text" class="custom-input custom-input-stretch" placeholder="请输入路径">
                                <div class="settings-buttons">
                                    <button class="settings-btn" onclick="handleAutoGet()">自动获取</button>
                                    <button class="settings-btn" onclick="handlePreview()">预览</button>
                                </div>
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">启用默认光标</div>
                            <div class="settings-control"><input type="checkbox" id="enableDefaultCursor"></div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">启动全屏暂停</div>
                            <div class="settings-control"><input type="checkbox" id="enableFullscreenPause" onchange="handleFullscreenPauseChange(this.checked)"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/settingsUI.js"></script>
</body>
</html>
